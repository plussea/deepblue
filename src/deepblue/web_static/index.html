<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepBlue · 深蓝工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="workspace">
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="深蓝首页"><span class="brand-mark">db<span>.</span></span><div>DeepBlue <small>深蓝</small></div></a>
    <button id="new-session" class="new-session"><span>＋</span> 新建会话</button>
    <div class="section-label">项目<button id="projects-open" class="icon-button" title="切换项目">切换</button></div>
    <div class="project"><span class="folder-icon">▱</span><div id="project-name">当前项目</div><span class="project-dot"></span></div>
    <label class="search"><span>⌕</span><input id="session-search" placeholder="搜索会话…" aria-label="搜索会话"></label>
    <div class="section-label history-label">最近会话 <span id="session-count">0</span></div>
    <label class="archive-toggle"><input type="checkbox" id="show-archived"> 已归档</label><nav id="sessions" aria-label="最近会话"></nav><button id="more-sessions" class="quiet-button" hidden>更多会话</button><button id="settings-open" class="quiet-button">⚙ 模型与 API 设置</button>
    <div class="sidebar-footer"><span class="avatar">深</span><div>本地工作空间<small id="version">DeepBlue</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><button id="toggle-sessions" class="icon-button mobile-only" title="显示会话侧栏">☰ 会话</button><div class="breadcrumb"><span class="mini-mark">◈</span><span id="breadcrumb-project">workspace</span><span>/</span><strong id="session-title">新会话</strong></div><button id="toggle-files" class="icon-button" title="显示或隐藏文件面板">▤ 文件面板</button></header>
    <div class="conversation-header"><div><span class="status-dot" id="connection-dot"></span><strong id="model-name">DeepSeek</strong></div><div class="header-actions"><button id="retry" class="quiet-button" disabled>继续请求</button><button id="compact" class="quiet-button" disabled>压缩上下文</button></div></div>
    <div class="session-toolbar"><details class="session-menu"><summary aria-label="会话操作">会话操作 ···</summary><div class="session-menu-items"><button id="fork-session">分叉会话</button><button id="queue-open">消息队列</button><button id="rename-session" disabled>重命名</button><button id="archive-session" disabled>归档会话</button><button id="export-md" disabled>导出 MD</button><button id="export-json" disabled>导出 JSON</button></div></details><button id="older-messages" hidden>加载历史</button><button id="active-job" hidden></button><button id="reconnect" hidden>重新连接</button></div><div id="banner" class="banner" role="status" hidden></div>
    <section id="conversation" class="conversation" aria-label="对话记录" aria-live="polite">
      <div class="welcome" id="welcome"><h1>有什么可以帮你？</h1></div>
    </section>
    <button id="new-messages" class="quiet-button" hidden>↓ 有新消息</button><div class="composer-wrap"><form id="composer"><div id="mentions" class="mentions" hidden></div><textarea id="prompt" rows="1" placeholder="输入任务…" aria-label="任务描述" title="Enter 发送，Shift+Enter 换行"></textarea><div class="composer-tools"><details class="verification-config"><summary aria-label="任务选项" title="任务选项">＋</summary><div class="composer-options"><button id="clear-draft" type="button" class="quiet-button">清除草稿</button><label for="verify-command">验收命令</label><input id="verify-command" placeholder="例如 python -B -m unittest discover -s tests"></div></details><div><button type="button" id="steer" class="quiet-button" hidden title="下一次模型请求前接收">补充指令</button><button type="button" id="stop" class="stop-button" hidden>停止执行</button><button type="submit" id="send" class="send-button" title="发送任务（Enter）" aria-label="发送任务">↑</button></div></div></form></div>
    <footer class="statusbar"><span id="run-status"><i></i> 就绪</span><span id="context-footer">0 tokens · 0 次压缩</span></footer>
  </main>
  <aside class="inspector" id="inspector"><div id="inspector-resize" role="separator" aria-orientation="vertical" aria-label="调整文件面板宽度" tabindex="0"></div><div class="inspector-title"><strong>项目与运行</strong><div><button class="icon-button" id="refresh-files" title="刷新文件">↻</button><button class="icon-button" id="expand-inspector" title="放大面板" aria-label="放大面板">⤢</button><button class="icon-button" id="hide-inspector" title="隐藏面板" aria-label="隐藏面板">×</button></div></div><div class="inspector-tabs"><button class="active" data-panel="files-panel">文件</button><button data-panel="details-panel">状态</button><button data-panel="review-panel">修改</button></div>
    <section id="files-panel"><div id="file-tabs" role="tablist" aria-label="打开的文件"></div><div id="file-browser"><input id="file-search" class="panel-input" placeholder="搜索文件名 / 路径" aria-label="搜索文件"><div class="file-path"><button id="parent-folder" title="返回上级目录">↑</button><span id="folder-path">项目根目录</span></div><div id="files" class="file-tree"></div></div><div class="file-preview" id="file-preview" role="tabpanel" hidden><div class="preview-header"><span id="preview-name"></span><button id="close-preview" title="关闭文件预览">×</button></div><div class="preview-controls"><button id="markdown-toggle" hidden>源码</button><input id="file-find" placeholder="查找内容" aria-label="查找文件内容"><input id="file-line" type="number" min="1" value="1" aria-label="跳转行号"><button id="insert-reference">引用文件</button></div><pre id="preview-code"></pre><div id="preview-markdown" class="message-body markdown-document" hidden></div></div></section>
    <section id="details-panel" hidden><div class="metric-card"><span>活动上下文</span><strong id="context-value">0 <small>/ 400 KB</small></strong><progress id="context-progress" max="100" value="0"></progress><small>按字节统计，不等同于 Token</small></div><div class="metric-grid"><div><small>累计 Token</small><strong id="tokens-value">0</strong></div><div><small>压缩次数</small><strong id="compact-value">0</strong></div></div><div class="detail-section"><h3>验收结果</h3><div class="verification-badge" id="verification-state">未配置验收</div><div id="evidence-list"></div><h3>工具日志</h3><div id="tool-logs"></div></div><div class="detail-section"><details><summary>任务状态</summary><pre id="task-state-detail">暂无记录</pre></details><h3>恢复核对</h3><p id="recovery-summary">暂无记录</p><pre id="recovery-detail"></pre></div></section>
    <section id="review-panel" hidden><button id="refresh-review" class="quiet-button">刷新差异</button><div id="review-content"></div></section></aside>
</div>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>模型与 API 设置</h2><button data-close="settings-dialog">关闭</button></div>
<p>配置保存在本机。新设置仅影响后续任务。</p><label>API 配置<select id="setting-profile"></select></label><button id="profile-new">新增 API</button><label>配置名称<input id="setting-name"></label><label>接口类型<select id="setting-provider"><option value="deepseek">DeepSeek 预设</option><option value="openai-compatible">OpenAI 兼容（Chat Completions）</option></select></label>
<label>模型<input id="setting-model"><small id="source-model"></small></label>
<label>API 地址<input id="setting-base_url"><small id="source-base_url"></small></label>
<label>超时（秒）<input id="setting-timeout" type="number" min="0.1" max="300"><small id="source-timeout"></small></label>
<label>API Key<input id="setting-api_key" type="password" autocomplete="off"><small id="source-api_key"></small></label><button id="key-toggle" type="button">显示 Key</button><details><summary>兼容设置</summary><label>输出上限字段<select id="setting-token_parameter"><option>max_tokens</option><option>max_completion_tokens</option></select></label><label><input id="setting-include_usage" type="checkbox">请求流式 Token 用量</label></details>
<div class="dialog-actions"><button id="settings-save">保存</button><button id="settings-clear-key">清除保存的 Key</button><button id="settings-test">测试连接（调用 API）</button></div><p id="settings-result" role="status"></p></dialog>
<dialog id="rename-dialog"><form id="rename-form"><label>会话标题<input id="rename-value" maxlength="120" required></label><button type="submit">保存标题</button><button type="button" data-close="rename-dialog">取消</button></form></dialog>
<dialog id="log-dialog"><div class="dialog-heading"><h2 id="log-title"></h2><button data-close="log-dialog">关闭</button></div><pre id="log-content"></pre><button id="log-more">读取下一段</button></dialog>
<dialog id="projects-dialog"><div class="dialog-heading"><h2>项目</h2><button data-close="projects-dialog">关闭</button></div><div id="project-list"></div><form id="project-add"><label>已有项目绝对目录<input id="project-path" required></label><button>添加并打开</button></form></dialog>
<dialog id="queue-dialog"><div class="dialog-heading"><h2>消息队列</h2><button id="queue-refresh">刷新</button><button data-close="queue-dialog">关闭</button></div><div id="queue-list"></div></dialog>
<dialog id="fork-dialog"><form id="fork-form"><label>复制前多少条消息（含系统消息；留空复制全部）<input id="fork-count" type="number" min="1" step="1"></label><button>创建分叉</button><button type="button" data-close="fork-dialog">取消</button></form></dialog>
<script src="/app.js" type="module"></script></body></html>
