[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepblue-agent"
version = "0.7.2"
description = "深蓝：基于 DeepSeek API 的轻量级终端 coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
deepblue = "deepblue.cli:main"
deepblue-web = "deepblue.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepblue = ["web_static/*.html", "web_static/*.css", "web_static/*.js", "builtin/commands/*.md", "builtin/skills/*/SKILL.md"]
